# Base44 sandbox environment for the Fisk Dimension Next.js app.
# Runs the cloned source with `next dev` (Turbopack) so edits appear live.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        stamp=node_modules/.base44-lock-hash
        want=$(sha256sum package-lock.json | cut -d' ' -f1)
        if [ ! -f "$$stamp" ] || [ "$$(cat $$stamp)" != "$$want" ]; then
          npm ci --no-audit --no-fund
          mkdir -p node_modules
          echo "$$want" > "$$stamp"
        fi
        exec npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:9002"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: on-failure
    labels:
      base44.project: Fisk Dimension
      base44.kind: web
      base44.port: "3000"

volumes:
  web_node_modules:
